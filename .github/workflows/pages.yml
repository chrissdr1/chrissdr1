name: Terbitkan ke GitHub Pages

# Isi folder app/ disalin ke branch gh-pages setiap ada perubahan di master.
# GitHub menerbitkan branch gh-pages sebagai situs Pages tanpa perlu klik di
# Settings (token bawaan workflow tidak boleh membuat situs Pages lewat API,
# jadi jalur "GitHub Actions" tidak bisa dipakai tanpa campur tangan manual).
on:
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Terbitkan ${{ github.sha }}"
